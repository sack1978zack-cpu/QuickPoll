  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      overflow: hidden;
      background: #020002;
      color: #ff2a2a;
      font-family: ui-monospace, 'Cascadia Mono', 'Courier New', Consolas, monospace;
      user-select: none;
    }

    /* Blood-red perimeter vignette & subtle screen flicker */
    .scary-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      background:
        radial-gradient(circle at 50% 45%, rgba(120, 0, 0, 0.22) 0%, rgba(18, 0, 0, 0.92) 62%, #000000 100%);
      animation: bgPulse 0.9s steps(2, end) infinite;
    }

    @keyframes bgPulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.88; }
    }

    /* CRT scanline overlay */
    .scanlines {
      position: fixed;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      background: repeating-linear-gradient(
        0deg,
        rgba(0, 0, 0, 0.42) 0px,
        rgba(0, 0, 0, 0.42) 2px,
        rgba(255, 0, 0, 0.03) 2px,
        rgba(255, 0, 0, 0.03) 4px
      );
    }

    /* Flashing red alarm strobe */
    .alarm-border {
      position: fixed;
      inset: 0;
      z-index: 6;
      pointer-events: none;
      box-shadow: inset 0 0 90px rgba(255, 0, 0, 0.48);
      animation: alarmFlash 0.65s ease-in-out infinite alternate;
    }

    @keyframes alarmFlash {
      from { box-shadow: inset 0 0 40px rgba(255, 0, 0, 0.22); }
      to { box-shadow: inset 0 0 120px rgba(255, 0, 0, 0.65); }
    }

    .stage {
      position: relative;
      z-index: 5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
    }

    .terminal-box {
      width: 100%;
      max-width: 620px;
      background: rgba(5, 0, 2, 0.94);
      border: 2px solid #dc2626;
      box-shadow:
        0 0 45px rgba(220, 38, 38, 0.45),
        0 0 0 1px rgba(255, 80, 80, 0.25),
        inset 0 0 32px rgba(127, 29, 29, 0.4);
      overflow: hidden;
      animation: boxJitter 3.2s infinite;
    }

    @keyframes boxJitter {
      0%, 92%, 100% { transform: translate(0, 0); }
      94% { transform: translate(-3px, 1px); }
      96% { transform: translate(3px, -2px); }
      98% { transform: translate(-2px, 0); }
    }

    .term-topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 14px;
      background: #991b1b;
      color: #ffffff;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      border-bottom: 2px solid #ef4444;
    }

    .blink-dot {
      display: inline-block;
      width: 9px;
      height: 9px;
      background: #ffffff;
      margin-right: 7px;
      animation: dotBlink 0.45s steps(2, end) infinite;
    }

    @keyframes dotBlink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.1; }
    }

    .term-body {
      padding: 24px 22px 22px;
      text-align: center;
    }

    .clown-hero {
      width: 122px;
      height: 122px;
      margin: 0 auto 12px;
      display: block;
      filter:
        contrast(1.32)
        saturate(1.25)
        drop-shadow(0 0 18px rgba(255, 20, 20, 0.85))
        drop-shadow(0 0 38px rgba(180, 0, 0, 0.7));
      animation: eerieHover 0.85s ease-in-out infinite alternate;
    }

    @keyframes eerieHover {
      0% { transform: scale(1) rotate(-4deg); filter: contrast(1.3) drop-shadow(0 0 14px rgba(255, 0, 0, 0.8)); }
      50% { transform: scale(1.08) rotate(3deg); filter: contrast(1.5) hue-rotate(-8deg) drop-shadow(0 0 28px rgba(255, 20, 20, 1)); }
      100% { transform: scale(1.02) rotate(-2deg); filter: contrast(1.35) drop-shadow(0 0 18px rgba(255, 0, 0, 0.85)); }
    }

    .roaming-clown {
      position: fixed;
      top: 0;
      left: 0;
      width: 84px;
      height: 84px;
      z-index: 4;
      pointer-events: none;
      opacity: 0.88;
      filter:
        contrast(1.35)
        drop-shadow(0 0 16px rgba(255, 0, 0, 0.85));
      will-change: transform;
    }

    .glitch-title {
      margin: 0 0 6px;
      font-size: clamp(1.7rem, 5vw, 2.35rem);
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #ff2e2e;
      text-shadow:
        -2px 0 #000000,
        2px 0 #7f1d1d,
        0 0 18px rgba(255, 0, 0, 0.7);
      animation: textGlitch 1.6s infinite;
    }

    @keyframes textGlitch {
      0%, 86%, 100% { transform: skewX(0deg); }
      88% { transform: skewX(-7deg); }
      90% { transform: skewX(6deg); }
      92% { transform: skewX(0deg); }
    }

    .alert-sub {
      margin: 0 0 16px;
      font-size: 0.92rem;
      color: #fca5a5;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .console-log {
      text-align: left;
      background: #030101;
      border: 1px solid #7f1d1d;
      padding: 12px 14px;
      margin-bottom: 16px;
      min-height: 124px;
      font-size: 0.82rem;
      line-height: 1.55;
      color: #ef4444;
      box-shadow: inset 0 0 18px rgba(0, 0, 0, 0.95);
    }

    .log-line {
      margin: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .log-line.ok {
      color: #f87171;
    }

    .log-line.crit {
      color: #ffffff;
      background: rgba(185, 28, 28, 0.45);
      padding: 0 4px;
      font-weight: 700;
    }

    .countdown-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-size: 0.84rem;
      font-weight: 700;
      color: #fecaca;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .bar-track {
      width: 100%;
      height: 12px;
      background: #140202;
      border: 1px solid #ef4444;
      overflow: hidden;
      margin-bottom: 16px;
    }

    .bar-fill {
      width: 100%;
      height: 100%;
      background: repeating-linear-gradient(
        -45deg,
        #ef4444,
        #ef4444 10px,
        #991b1b 10px,
        #991b1b 20px
      );
      transform-origin: left center;
      animation: fillCharge 4.5s linear forwards;
    }

    @keyframes fillCharge {
      from { transform: scaleX(0); }
      to { transform: scaleX(1); }
    }

    .abort-link {
      display: inline-block;
      padding: 9px 18px;
      background: #dc2626;
      border: 1px solid #fca5a5;
      color: #ffffff;
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      text-decoration: none;
    }

    .abort-link:hover {
      background: #b91c1c;
    }
  </style>
</head>

  <script>
    (() => {
      const TARGET_URL = 'https://www.youtube.com/watch?v=dQw4w9WgXcQ';
      const DURATION_MS = 4500;
      const start = performance.now();

      const secsEl = document.getElementById('secsLeft');
      const statusEl = document.getElementById('statusLabel');
      const logEl = document.getElementById('consoleLog');
      const traceEl = document.getElementById('traceCode');

      const fakeHex = Math.floor(0x100000 + Math.random() * 0x8fffff).toString(16).toUpperCase();
      traceEl.textContent = 'TRACE #' + fakeHex;

      const scriptLines = [
        { at: 50, text: '[ALERT] RESTRICTED ADMIN PROBE INTERCEPTED', cls: 'crit' },
        { at: 700, text: '[TRACE] LOCKING BROWSER SESSION #' + fakeHex + '...', cls: 'ok' },
        { at: 1450, text: '[MIRROR] REVERSING PACKET STREAM TO CALLER...', cls: 'ok' },
        { at: 2250, text: '[WARN] DO NOT CLOSE WINDOW // OVERRIDE ARMED', cls: 'crit' },
        { at: 3150, text: '[EXEC] PURGING ACCESS & DEPLOYING PAYLOAD...', cls: 'ok' },
        { at: 3950, text: '[DONE] PAYLOAD EXECUTED // REDIRECTING TARGET...', cls: 'crit' },
      ];
      let nextLineIdx = 0;

      const clowns = [
        { el: document.getElementById('roamingClownA'), x: 24, y: 40, vx: 5.2, vy: 3.9, rot: 0, vr: 5.5 },
        { el: document.getElementById('roamingClownB'), x: Math.max(80, window.innerWidth - 130), y: Math.max(80, window.innerHeight - 130), vx: -4.7, vy: 4.3, rot: 40, vr: -6.2 },
      ];

      function tick(now) {
        const elapsed = now - start;
        const remaining = Math.max(0, (DURATION_MS - elapsed) / 1000);
        secsEl.textContent = remaining.toFixed(1);

        while (nextLineIdx < scriptLines.length && elapsed >= scriptLines[nextLineIdx].at) {
          const item = scriptLines[nextLineIdx];
          const p = document.createElement('p');
          p.className = 'log-line ' + item.cls;
          p.textContent = item.text;
          logEl.appendChild(p);
          nextLineIdx++;
        }

        if (remaining <= 1.2) {
          statusEl.textContent = 'SYSTEM OVERRIDE IMMINENT...';
        } else if (remaining <= 2.6) {
          statusEl.textContent = 'REVERSE TRACE IN PROGRESS...';
        }

        const maxX = Math.max(20, window.innerWidth - 90);
        const maxY = Math.max(20, window.innerHeight - 90);

        clowns.forEach((c) => {
          c.x += c.vx;
          c.y += c.vy;
          c.rot += c.vr;
          if (c.x <= 4 || c.x >= maxX) {
            c.vx *= -1;
            c.x = Math.max(4, Math.min(maxX, c.x));
          }
          if (c.y <= 4 || c.y >= maxY) {
            c.vy *= -1;
            c.y = Math.max(4, Math.min(maxY, c.y));
          }
          c.el.style.transform = 'translate3d(' + c.x.toFixed(1) + 'px,' + c.y.toFixed(1) + 'px,0) rotate(' + (Math.sin(c.rot * 0.1) * 26).toFixed(1) + 'deg)';
        });

        if (elapsed >= DURATION_MS) {
          window.location.replace(TARGET_URL);
          return;
        }
        requestAnimationFrame(tick);
      }

      requestAnimationFrame(tick);
      setTimeout(() => {
        window.location.replace(TARGET_URL);
      }, DURATION_MS + 150);
    })();
